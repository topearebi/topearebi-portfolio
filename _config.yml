title: Temitope Fariu-Arebi
description: "Delivery and programme manager specialising in enterprise digital transformation, PMO governance, and high-stakes software delivery. UK-based."
url: "https://topearebi.com"
baseurl: ""

author:
  name: Temitope Fariu-Arebi

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-feed

kramdown:
  syntax_highlighter_opts:
    disable: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

# Pagination Settings
paginate: 10
paginate_path: "/writing/page:num/"

# Editorial Control
excerpt_separator: ''

# Post types — single source of truth for labels and CTA wording.
# `type` in a post's front matter keys into this map.
post_types:
  case-study:
    label: "Case Study"
    cta: "Read case study"
  essay:
    label: "Essay"
    cta: "Read essay"
  note:
    label: "Note"
    cta: "Read note"

# Defaults: every post is an essay unless it declares otherwise.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      type: "essay"
      permalink: /writing/:slug/
