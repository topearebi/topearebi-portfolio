<div class="page-container">
    <header class="card-header page-header">
        <h1 class="page-title">{{ page.title }}</h1>
        {% if page.description %}
        <p class="lead-text">{{ page.description }}</p>
        {% endif %}
    </header>

    <div class="page-content">
        {{ content }}
    </div>
</div>
